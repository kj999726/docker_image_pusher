name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  sync:
    name: Sync images to Aliyun (skopeo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Sync (registry -> registry)
        run: |
          set -euo pipefail

          # ---------- 1) 跨命名空间重名检测（保留你原来的逻辑） ----------
          declare -A seen
          declare -A dup
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ -z "$line" ]]; then continue; fi
            if [[ "$line" =~ ^[[:space:]]*# ]]; then continue; fi
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            base=$(echo "$image" | awk -F'/' '{print $NF}' | awk -F':' '{print $1}')
            ns=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            if [[ -n "${seen[$base]:-}" ]]; then
              if [[ "${seen[$base]}" != "$ns" ]]; then
                dup[$base]=1
              fi
            else
              seen[$base]="$ns"
            fi
          done < images.txt

          # ---------- 2) 逐个复制（流式，不占本地磁盘） ----------
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ -z "$line" ]]; then continue; fi
            if [[ "$line" =~ ^[[:space:]]*# ]]; then continue; fi

            # 保留你原来的 platform 前缀命名逻辑
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            if [ -z "$platform" ]; then
              platform_prefix=""
            else
              platform_prefix="${platform//\//_}_"
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            ns=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            base=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            ns_prefix=""
            if [[ -n "${dup[$base]:-}" ]]; then
              if [[ -n "$ns" ]]; then
                ns_prefix="${ns}_"
              fi
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${platform_prefix}${ns_prefix}${image_name_tag}"

            echo "=================================================="
            echo "▶ 复制: $image"
            echo "     -> $new_image"

            # --all 复制多架构；若个别单架构镜像报错，可去掉 --all
            skopeo copy --all \
              --retry-times 3 \
              --dest-creds "${ALIYUN_REGISTRY_USER}:${ALIYUN_REGISTRY_PASSWORD}" \
              "docker://${image}" "docker://${new_image}"
          done < images.txt

          echo "✅ 全部同步完成"
          df -hT / | tail -1
